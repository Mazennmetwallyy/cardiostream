[project]
name = "cardiostream"
version = "0.1.0"
description = "Real-time arrhythmia detection on streaming ECG"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mazen Metwally" }]
# Runtime (serving) dependencies only: no PyTorch.
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "onnxruntime>=1.18",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
train = ["torch>=2.3", "onnx>=1.16", "wfdb>=4.1", "scikit-learn>=1.4", "matplotlib>=3.8"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cardiostream"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
